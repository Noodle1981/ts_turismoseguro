openapi: 3.1.0
info:
  title: Turismo Seguro San Juan - API
  version: 1.0.0
  description: >
    API REST oficial de la plataforma Turismo Seguro San Juan.
    Gobernada bajo arquitectura Contract-First para certificación in situ,
    catálogo de alojamientos verificados, experiencias turísticas y gestión de comisiones.
  contact:
    name: Soporte Técnico Turismo Seguro
    url: https://turismoseguro.com.ar
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de desarrollo local (Laravel API)
  - url: https://api.turismoseguro.com.ar/api/v1
    description: Servidor de producción
tags:
  - name: Health
    description: Verificación de estado y salud del servicio API
  - name: Auth
    description: Autenticación, roles y recuperación de credenciales
  - name: Properties
    description: Catálogo y gestión de alojamientos con Sello TS
  - name: Experiences
    description: Experiencias turísticas verificadas
  - name: Departments
    description: Departamentos turísticos de San Juan
  - name: Validations
    description: Auditorías in situ y emisión de actas de verificación
  - name: Commissions
    description: Liquidación y devengamiento de comisiones a validadores

paths:
  /health:
    get:
      tags:
        - Health
      summary: Verificación de salud del sistema
      description: Retorna el estado operativo de la API, conexión a base de datos y marca temporal.
      operationId: checkHealth
      responses:
        '200':
          description: Servicio operativo y saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '500':
          description: Error de infraestructura o base de datos inaccesible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión con email y contraseña
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Credenciales válidas y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Error de validación o credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Cerrar sesión activa
      operationId: logout
      security:
        - sanctumCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sesión cerrada correctamente."
        '401':
          description: No autenticado

  /auth/me:
    get:
      tags:
        - Auth
      summary: Obtener perfil del usuario autenticado
      operationId: getAuthenticatedUser
      security:
        - sanctumCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserResource'
        '401':
          description: No autenticado

  /auth/register/rent:
    post:
      tags:
        - Auth
      summary: Registro de usuario interesado / turista con procedencia geográfica
      operationId: registerRent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRentPayload'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register/client:
    post:
      tags:
        - Auth
      summary: Registro de cliente oferente (propietario o anfitrión)
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientPayload'
      responses:
        '201':
          description: Anfitrión registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Solicitar enlace o token de recuperación de contraseña
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordPayload'
      responses:
        '200':
          description: Instrucciones de recuperación enviadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Se ha enviado un enlace de recuperación a tu correo."
        '422':
          description: Error de validación

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Restablecer contraseña mediante token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordPayload'
      responses:
        '200':
          description: Contraseña actualizada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tu contraseña ha sido restablecida exitosamente."
        '422':
          description: Token inválido o campos incorrectos

  /departments:
    get:
      tags:
        - Catálogo
      summary: Listado de departamentos con contador de ofertas verificadas
      operationId: getDepartments
      responses:
        '200':
          description: Lista de departamentos de San Juan
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'

  /properties:
    get:
      tags:
        - Catálogo
      summary: Listado público de propiedades verificadas con filtros y paginación
      operationId: getProperties
      parameters:
        - name: department
          in: query
          description: Slug o nombre del departamento
          schema:
            type: string
        - name: property_type
          in: query
          description: Tipo de alojamiento (Cabaña, Quinta con Piscina, etc.)
          schema:
            type: string
        - name: capacity
          in: query
          description: Capacidad mínima de huéspedes
          schema:
            type: integer
        - name: max_price
          in: query
          description: Precio máximo por noche/día
          schema:
            type: integer
        - name: search
          in: query
          description: Búsqueda por texto en título o descripción
          schema:
            type: string
        - name: amenities
          in: query
          description: Comodidades separadas por comas (WiFi, Piscina, etc.)
          schema:
            type: string
        - name: sort
          in: query
          description: Criterio de orden (price_asc, price_desc, recent)
          schema:
            type: string
            enum: [default, price_asc, price_desc, recent]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Catálogo paginado de propiedades verificadas
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer

  /properties/{slug}:
    get:
      tags:
        - Catálogo
      summary: Detalle completo de una propiedad verificada por slug
      operationId: getPropertyBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ficha de la propiedad
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada o no verificada

  /properties/{id}/availability:
    get:
      tags:
        - Catálogo
      summary: Calendario de disponibilidad y fechas ocupadas de una propiedad
      operationId: getPropertyAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          description: Fecha inicio formato YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Fecha fin formato YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de rangos o días ocupados
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - date
                        - status
                      properties:
                        date:
                          type: string
                          format: date
                        status:
                          type: string
                          enum: [occupied, blocked, reserved]

  /experiences:
    get:
      tags:
        - Catálogo
      summary: Listado público de experiencias y excursiones verificadas
      operationId: getExperiences
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de experiencias
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experience'

  /experiences/{slug}:
    get:
      tags:
        - Catálogo
      summary: Detalle completo de una experiencia por slug
      operationId: getExperienceBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ficha de la experiencia
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '404':
          description: Experiencia no encontrada

  /client/properties:
    $ref: './modules/propietario/paths.yaml#/clientProperties'

  /client/properties/{id}:
    $ref: './modules/propietario/paths.yaml#/clientPropertyById'

  /client/properties/{id}/availability:
    $ref: './modules/propietario/paths.yaml#/clientPropertyAvailability'

  /client/verifications/request:
    $ref: './modules/propietario/paths.yaml#/clientVerificationRequest'

  /client/properties/{id}/tenants:
    $ref: './modules/propietario/paths.yaml#/clientPropertyTenants'

  /client/properties/{id}/special-events:
    $ref: './modules/propietario/paths.yaml#/clientPropertySpecialEvents'



components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Autenticación de sesión basada en cookies para SPA con Laravel Sanctum.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticación personal para la App móvil del Validador.

  schemas:
    # --- Módulo Propietario / Anfitrión (/propietario/panel) ---
    AmenityBadge:
      $ref: './modules/propietario/schemas.yaml#/AmenityBadge'
    Tenant:
      $ref: './modules/propietario/schemas.yaml#/Tenant'
    SpecialEvent:
      $ref: './modules/propietario/schemas.yaml#/SpecialEvent'
    CalendarAvailabilityDay:
      $ref: './modules/propietario/schemas.yaml#/CalendarAvailabilityDay'

    HealthCheckResponse:

      type: object
      required:
        - status
        - timestamp
        - environment
      properties:
        status:
          type: string
          example: "ok"
          enum:
            - ok
            - degraded
            - maintenance
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T20:45:00Z"
        environment:
          type: string
          example: "local"
        services:
          type: object
          properties:
            database:
              type: string
              example: "connected"
            cache:
              type: string
              example: "connected"

    UserResource:
      type: object
      required:
        - id
        - name
        - email
        - role
        - is_local_resident
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Omar Olivera"
        email:
          type: string
          format: email
          example: "admin@turismoseguro.com.ar"
        role:
          type: string
          example: "admin"
          enum:
            - super_admin
            - admin
            - supervisor
            - validator
            - client
            - rent
        phone:
          type: string
          nullable: true
          example: "+54 9 264 400-0001"
        origin_country:
          type: string
          nullable: true
          example: "Argentina"
        origin_province:
          type: string
          nullable: true
          example: "San Juan"
        origin_city:
          type: string
          nullable: true
          example: "Capital"
        is_local_resident:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-10-09T20:00:00Z"

    LoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "anfitrion@turismoseguro.com.ar"
        password:
          type: string
          format: password
          example: "password123"

    RegisterRentPayload:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - is_local_resident
      properties:
        name:
          type: string
          example: "Carlos Benítez"
        email:
          type: string
          format: email
          example: "carlos.sanjuanino@gmail.com"
        password:
          type: string
          format: password
          example: "password123"
        password_confirmation:
          type: string
          format: password
          example: "password123"
        phone:
          type: string
          nullable: true
          example: "+54 9 264 400-0005"
        is_local_resident:
          type: boolean
          example: true
        origin_country:
          type: string
          nullable: true
          example: "Argentina"
        origin_province:
          type: string
          nullable: true
          example: "San Juan"
        origin_city:
          type: string
          nullable: true
          example: "Rivadavia"

    RegisterClientPayload:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - phone
      properties:
        name:
          type: string
          example: "Elena Morales"
        email:
          type: string
          format: email
          example: "elena.anfitriona@gmail.com"
        password:
          type: string
          format: password
          example: "password123"
        password_confirmation:
          type: string
          format: password
          example: "password123"
        phone:
          type: string
          example: "+54 9 264 400-0004"

    ForgotPasswordPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "usuario@ejemplo.com"

    ResetPasswordPayload:
      type: object
      required:
        - email
        - token
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    AuthResponse:
      type: object
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: "Autenticación exitosa."
        token:
          type: string
          example: "1|abcdef123456..."
        user:
          $ref: '#/components/schemas/UserResource'

    Department:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Calingasta"
        slug:
          type: string
          example: "calingasta"
        description:
          type: string
          nullable: true
          example: "Tierra de la Cordillera de los Andes, Barreal y astronomía."
        hero_image:
          type: string
          nullable: true
          example: "storage/img/departamentos/calingasta.jpg"
        is_active:
          type: boolean
          example: true

    PropertyImage:
      type: object
      required:
        - id
        - image_path
      properties:
        id:
          type: integer
          example: 1
        image_path:
          type: string
          example: "storage/img/propiedades/medanopileta.jpg"
        caption:
          type: string
          nullable: true
          example: "Piscina y solarium"
        is_primary:
          type: boolean
          example: true

    Property:
      type: object
      required:
        - id
        - title
        - slug
        - property_type
        - location
        - price
        - price_type
        - capacity
        - verification_status
        - publication_status
      properties:
        id:
          type: integer
          example: 123
        title:
          type: string
          example: "Refréscate en el Medanito de Rawson"
        slug:
          type: string
          example: "refrescate-en-el-medanito-de-rawson"
        property_type:
          type: string
          example: "Quinta con Piscina"
        location:
          type: string
          example: "Rawson, San Juan"
        address:
          type: string
          nullable: true
        description:
          type: string
          example: "Disfruta de un día de pileta y relax..."
        price:
          type: integer
          example: 25000
        price_type:
          type: string
          example: "por día"
        capacity:
          type: integer
          example: 15
        bedrooms:
          type: integer
          example: 0
        bathrooms:
          type: integer
          example: 2
        host_whatsapp:
          type: string
          nullable: true
          example: "+54 9 264 456-7890"
        verification_status:
          type: string
          example: "verified"
          enum: [pending, assigned, in_review, verified, rejected]
        publication_status:
          type: string
          example: "published"
          enum: [draft, published, archived, paused]
        verified_at:
          type: string
          format: date-time
          nullable: true
        verification_certificate_number:
          type: string
          nullable: true
          example: "TS-RAW-2026-081"
        verified_facade_image:
          type: string
          nullable: true
        featured:
          type: boolean
          example: true
        department:
          $ref: '#/components/schemas/Department'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImage'
        amenities:
          type: array
          items:
            oneOf:
              - type: string
                example: "Piscina"
              - $ref: '#/components/schemas/AmenityBadge'


    Experience:
      type: object
      required:
        - id
        - title
        - slug
        - category
        - main_location
        - price_per_person
        - duration
        - operator_name
        - is_verified
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: "Tour de las Estrellas en El Leoncito"
        slug:
          type: string
          example: "tour-de-las-estrellas-en-el-leoncito"
        category:
          type: string
          example: "Astronomía"
        main_location:
          type: string
          example: "Barreal, Calingasta"
        price_per_person:
          type: integer
          example: 12000
        duration:
          type: string
          example: "3-4 horas (nocturno)"
        short_description:
          type: string
          example: "Una noche mágica bajo uno de los cielos más limpios..."
        long_description:
          type: string
        operator_name:
          type: string
          example: "AstroTours San Juan"
        operator_whatsapp:
          type: string
          example: "+54 9 264 123-4567"
        operator_email:
          type: string
          nullable: true
        is_verified:
          type: boolean
          example: true
        featured:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Ocurrió un error inesperado al procesar la solicitud."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - "El formato del correo electrónico es inválido."
